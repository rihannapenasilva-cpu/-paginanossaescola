<html>
<head>
<style>
.dropbtn {
  background-color:#424e61;
  color: white;
  padding: 16px;
  font-size: 16px;
  border: none;
  cursor: pointer;
}

.dropdown {
  position: relative;
}

.dropdown-content {
  display: none;
  position: absolute;
  background-color: #f9f9f9;
  min-width: 200px;
  box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
}

.dropdown-content a {
  color: #c6d1e4;
  padding: 12px 16px;
  text-decoration: none;
  display: block;
}

.dropdown-content a:hover {
  background-color: #303c4f;
}

.dropdown:hover .dropdown-content {
  display: block;
}

.dropdown:hover .dropbtn {
  background-color:#2b313b
}
</style>
</head>
<body>

<h2></h2>


<div class="dropdown">
  <button class="dropbtn">Dropdown Menu</button>
  <div class="dropdown-content">
  <a href="index.html">Link 1</a>
  <a href="sobre.html">Link 2</a>
  <a href="contato.html">Link 3</a>
  </div>
</div>


</body>
</html>
